<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b3a" />
    <meta name="description" content="Track your Kwacha: income, expenses, budgets, savings goals, bills and loans. Works offline." />
    <title>Ndalama · Money Manager</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28" />
        <span>Ndalama</span>
      </div>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">⚙︎</button>
    </header>

    <main id="view" tabindex="-1"></main>

    <button class="fab" id="add-btn" aria-label="Add income or expense">+</button>

    <nav class="tabbar" aria-label="Sections">
      <button data-tab="home" class="active"><span>🏠</span>Home</button>
      <button data-tab="budget"><span>📊</span>Budget</button>
      <button data-tab="goals"><span>🎯</span>Goals</button>
      <button data-tab="bills"><span>🧾</span>Bills</button>
      <button data-tab="loans"><span>🤝</span>Loans</button>
      <button data-tab="report"><span>📅</span>Report</button>
    </nav>

    <dialog id="sheet">
      <form method="dialog" id="sheet-form">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
        </div>
        <div id="sheet-body"></div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
