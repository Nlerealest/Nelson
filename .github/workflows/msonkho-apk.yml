# Builds the Msonkho Pocket Android app (msonkho/) and publishes it as the
# "msonkho-latest" release:
# https://github.com/Nlerealest/Nelson/releases/download/msonkho-latest/msonkho-pocket.apk
#
# Lint, typecheck and the tax-calculation tests must pass before the APK is
# built. Signed with the same release key as Ndalama when those secrets are
# set; otherwise with the debug key (fine for installing and demos).
name: Msonkho Pocket APK

on:
  push:
    branches: [claude/malawi-money-management-knal4c, ccr-6a0e1ce8-soknan]
    paths: ['msonkho/**', '.github/workflows/msonkho-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msonkho-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: msonkho
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: msonkho/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tax calculation tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Write release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "NDALAMA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secrets: signing with the debug key."
          fi

      - name: Build APK
        working-directory: msonkho/android
        env:
          NDALAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk msonkho-pocket.apk
          TITLE="Msonkho Pocket $(node -p "require('./app.json').expo.version")"
          NOTES="Msonkho Pocket: an independent taxpayer app prototype for Malawi. Not an official MRA app. From commit ${GITHUB_SHA::7}. On your Android phone: download msonkho-pocket.apk, open it and allow installing from your browser if asked."
          # Never delete the old download first: replace the file in place, so
          # the link keeps working even if publishing fails.
          if gh release view msonkho-latest >/dev/null 2>&1; then
            gh release upload msonkho-latest msonkho-pocket.apk --clobber
            gh release edit msonkho-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create msonkho-latest msonkho-pocket.apk --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
