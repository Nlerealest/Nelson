# Builds the Twizzy Android app (twizzy/) and publishes it as the
# "twizzy-latest" release:
# https://github.com/Nlerealest/Nelson/releases/download/twizzy-latest/twizzy.apk
#
# The Supabase project URL and anon key are built in from the SUPABASE_URL and
# SUPABASE_ANON_KEY secrets (if they're missing, the app asks for them once).
# Signed with the same release key as Ndalama when those secrets are set.
name: Twizzy APK

on:
  push:
    branches: [claude/malawi-money-management-knal4c]
    paths: ['twizzy/**', '.github/workflows/twizzy-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twizzy-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: twizzy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: twizzy/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Write release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "NDALAMA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secrets: signing with the debug key."
          fi

      - name: Build APK
        working-directory: twizzy/android
        env:
          NDALAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk twizzy.apk
          TITLE="Twizzy $(node -p "require('./app.json').expo.version")"
          NOTES="Twizzy, the control app for Ndalama's marketing agent. From commit ${GITHUB_SHA::7}. On your Android phone: download twizzy.apk, open it and allow installing from your browser if asked."
          # Never delete the old download first: replace the file in place, so
          # the link keeps working even if publishing fails.
          if gh release view twizzy-latest >/dev/null 2>&1; then
            gh release upload twizzy-latest twizzy.apk --clobber
            gh release edit twizzy-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create twizzy-latest twizzy.apk --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
