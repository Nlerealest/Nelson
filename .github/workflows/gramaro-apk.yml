# Builds the Gramaro Android app (gramaro/) and publishes it as the
# "gramaro-latest" release:
# https://github.com/Nlerealest/Nelson/releases/download/gramaro-latest/gramaro.apk
#
# The Supabase project URL and anon key are built in from the GRAMARO_SUPABASE_URL
# and GRAMARO_SUPABASE_ANON_KEY secrets (if they're missing, the app asks for them once).
# Signed with the same release key as Ndalama when those secrets are set.
name: Gramaro APK

on:
  push:
    paths: ['gramaro/**', '.github/workflows/gramaro-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gramaro-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gramaro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gramaro/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Write release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "NDALAMA_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key secrets: signing with the debug key."
          fi

      - name: Build APK
        working-directory: gramaro/android
        env:
          NDALAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.GRAMARO_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.GRAMARO_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gramaro.apk
          TITLE="Gramaro $(node -p "require('./app.json').expo.version")"
          NOTES="Gramaro Travel: flight requests, live fares, mobile money payments and tickets. From commit ${GITHUB_SHA::7}. On your Android phone: download gramaro.apk, open it and allow installing from your browser if asked."
          # Never delete the old download first: replace the file in place, so
          # the link keeps working even if publishing fails.
          if gh release view gramaro-latest >/dev/null 2>&1; then
            gh release upload gramaro-latest gramaro.apk --clobber
            gh release edit gramaro-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create gramaro-latest gramaro.apk --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
