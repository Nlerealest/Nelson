# Builds the Nelson phone app (nelson-app/) into an Android APK on GitHub's
# machines and publishes it as a GitHub Release you can download on your phone.
name: Build Nelson APK

on:
  push:
    branches: [main, claude/nelson-gold-trading-bot-ncchgr]
    paths: ["nelson-app/**", ".github/workflows/nelson-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nelson-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nelson-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nelson-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npx expo lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: nelson-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="Nelson-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nelson-apk
          path: nelson-app/${{ steps.apk.outputs.name }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nelson-app-v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: Nelson app ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          files: nelson-app/${{ steps.apk.outputs.name }}
          body: |
            Nelson phone app for Android: monitor and control the Nelson XAUUSD bot.
            **Install:** open this page on your phone, tap the `.apk` below, then allow "Install unknown apps" for your browser when Android asks.
            Built from ${{ github.sha }}.
