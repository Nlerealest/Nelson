# King Tonka live: clips a stream while it is still live (one run per stream).
# The "King Tonka agent" run starts it when a pasted link is live; it starts a fresh
# run of itself before GitHub's 6-hour limit while the stream goes on.
#
# Every 15 minutes of stream: transcribe it, Claude (your Claude plan, through
# Claude Code) picks the best moments, and the clips go to the app. See
# kingtonka/agent/live.py.
name: King Tonka live

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'The live video to clip (its id in the app, p-…)'
        required: true

permissions:
  contents: read
  actions: write  # to start the next run when a stream goes past 6 hours

concurrency:
  group: kingtonka-live-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      KT_WORK: ${{ github.workspace }}/kt-work
      KT_REF: ${{ github.ref_name }}
      KT_WHISPER: base  # the faster speech model, so each part is done before the next one
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kingtonka/agent/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # yt-dlp needs a JavaScript runtime for YouTube.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Video tools and Claude Code
        timeout-minutes: 25
        run: |
          # Ubuntu's package servers sometimes hang: give up on a stuck try and try again (never wait for hours).
          for i in 1 2 3; do
            sudo dpkg --configure -a >/dev/null 2>&1 || true
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq \
              && sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                   install -y -qq ffmpeg >/dev/null \
              && break
            echo "Installing ffmpeg didn't finish (try $i of 3), trying again…"; sleep 15
          done
          command -v ffmpeg >/dev/null
          pip install -q -r kingtonka/agent/requirements.txt
          pip install -q -U --pre "yt-dlp[default]"
          npm install -g --silent @anthropic-ai/claude-code
          mkdir -p ~/.local/share/fonts
          curl -sSL --retry 3 --max-time 120 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter && find /tmp/inter -name "*.otf" -exec cp {} ~/.local/share/fonts/ \; && fc-cache -f >/dev/null

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kt-whisper-v1

      - name: Your YouTube / Twitch sign-in (optional)
        env:
          COOKIES: ${{ secrets.KT_COOKIES || secrets.KT_YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s\n' "$COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "KT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Clip it live
        run: python kingtonka/agent/live.py "$PROJECT"
