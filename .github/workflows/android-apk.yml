# Builds an installable Android APK on every push to the app branch and
# publishes it as the "ndalama-latest" release, so testers always download
# the newest build from the same link:
# https://github.com/Nlerealest/Nelson/releases/download/ndalama-latest/ndalama.apk
name: Android APK

on:
  push:
    branches: [claude/malawi-money-management-knal4c]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The android/ folder is generated here from app.json (Continuous
      # Native Generation) and never committed.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The release build is signed with the debug key: fine for testing
      # and sideloading, not for the Play Store (use EAS for that).
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ndalama.apk
          gh release delete ndalama-latest --yes --cleanup-tag || true
          gh release create ndalama-latest ndalama.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ndalama test build" \
            --notes "Test build from ${GITHUB_SHA::7}. On your Android phone: download ndalama.apk, open it and allow installing from your browser if asked."
