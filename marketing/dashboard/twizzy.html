<title>Twizzy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a control room — fixed left rail of sections, main column of cards; rail becomes a top tab strip on phones. */
:root {
  --bg: #f3f5f1; --panel: #ffffff; --panel-2: #f8faf6; --line: #dfe5dc; --fg: #17201a; --muted: #66726a;
  --accent: #0d7a42; --accent-ink: #ffffff; --accent-soft: #e2f3e8;
  --warn: #9a5a00; --warn-soft: #fff1da; --bad: #b42318; --bad-soft: #fde8e6; --info: #2c62a8; --info-soft: #e7eff9;
  --display: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius: 14px; --shadow: 0 1px 2px rgba(20, 40, 25, .06), 0 8px 24px -16px rgba(20, 40, 25, .25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1411; --panel: #161d18; --panel-2: #1b231e; --line: #29342d; --fg: #e7eee9; --muted: #95a39a;
  --accent: #3ccf7f; --accent-ink: #062a15; --accent-soft: #173a26;
  --warn: #f1b75a; --warn-soft: #3a2b12; --bad: #ff8b7e; --bad-soft: #3d1c19; --info: #8db8f2; --info-soft: #18263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1411; --panel: #161d18; --panel-2: #1b231e; --line: #29342d; --fg: #e7eee9; --muted: #95a39a;
  --accent: #3ccf7f; --accent-ink: #062a15; --accent-soft: #173a26;
  --warn: #f1b75a; --warn-soft: #3a2b12; --bad: #ff8b7e; --bad-soft: #3d1c19; --info: #8db8f2; --info-soft: #18263a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--panel); border-right: 1px solid var(--line);
  padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  font: 800 22px/1 var(--display); flex: none; }
.brand b { font: 800 22px/1 var(--display); letter-spacing: -.02em; display: block; }
.brand small { color: var(--muted); font-size: 12px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 600; }
.nav:hover { background: var(--panel-2); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font: 500 12px/1 var(--mono); background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 4px 7px; }
.nav .count:empty { display: none; }
.rail-foot { margin-top: auto; padding: 12px; border-radius: 12px; background: var(--panel-2); font-size: 13px; color: var(--muted); }
.rail-foot strong { color: var(--fg); display: block; }
main { padding-block: 28px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 800 clamp(26px, 3.2vw, 34px)/1.1 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
h2 { font: 700 18px/1.25 var(--display); letter-spacing: -.01em; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .label { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi .value { font: 800 34px/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.plat { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font: 700 11px/1 var(--mono); color: #fff; flex: none; }
.p-tiktok { background: #111; } .p-instagram { background: #c13584; } .p-facebook { background: #1877f2; } .p-x { background: #2b2b2b; }
.p-apkpure { background: #24a148; } .p-uptodown { background: #1b6fd0; }
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .title { font-weight: 700; }
.item .meta { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .nav:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; font-family: var(--display); font-size: 17px; }
textarea, input[type=text], input[type=url], input[type=number], select { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 12px; }
textarea { min-height: 92px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.media { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #0e110f; overflow: hidden; display: grid; place-items: center; color: #8a958e; }
.media video, .media img { width: 100%; height: 100%; object-fit: contain; display: block; }
.approval { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; }
.caption { white-space: pre-wrap; background: var(--panel-2); border-radius: 10px; padding: 12px; font-size: 14px; }
.feed .item { font-size: 14px; }
.feed time { font: 500 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; }
.chan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.chan .c { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--panel-2); min-width: 0; }
.chan .c div { min-width: 0; }
.chan .c .h { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan .c .s { font-size: 12px; color: var(--muted); }
.ideas { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.idea h3 { font: 700 17px/1.25 var(--display); margin: 8px 0 6px; }
.idea p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.idea .hook { font-style: italic; color: var(--fg); }
.stats { display: flex; gap: 14px; font: 500 12px/1 var(--mono); color: var(--muted); flex-wrap: wrap; }
.ask { display: flex; gap: 14px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; }
.ask .mark { width: 34px; height: 34px; font-size: 18px; border-radius: 10px; }
.notice { font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }
.settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.freq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--panel); padding: 8px 12px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); z-index: 5; gap: 6px; }
  .brand, .rail-foot { display: none; }
  .nav { white-space: nowrap; padding: 8px 12px; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 50px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two, .approval, .settings { grid-template-columns: minmax(0, 1fr); }
  .chan { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .freq { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><div class="mark" aria-hidden="true">T</div><div><b>Twizzy</b><small>Marketing for Ndalama</small></div></div>
    <a class="nav" href="#overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h7V3H3zM14 21h7v-9h-7zM14 3v5h7V3zM3 21h7v-5H3z"/></svg>Overview</a>
    <a class="nav" href="#approvals" data-view="approvals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Approvals<span class="count" id="c-approvals"></span></a>
    <a class="nav" href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
    <a class="nav" href="#ideas" data-view="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg>Ideas<span class="count" id="c-ideas"></span></a>
    <a class="nav" href="#inbox" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Inbox<span class="count" id="c-inbox"></span></a>
    <a class="nav" href="#references" data-view="references"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg>References<span class="count" id="c-refs"></span></a>
    <a class="nav" href="#prefs" data-view="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    <div class="rail-foot" id="rail-foot"><strong>Connecting…</strong>Loading Twizzy's data.</div>
  </nav>
  <main><div class="wrap" id="view" aria-live="polite"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const PLAT = { tiktok: ['TT', 'TikTok'], instagram: ['IG', 'Instagram'], facebook: ['FB', 'Facebook'], x: ['X', 'X'], apkpure: ['AP', 'APKPure'], uptodown: ['UD', 'Uptodown'] };
const state = { posts: [], concepts: [], inbox: [], refs: [], activity: [], settings: null, accounts: null, request: null, loaded: false, offline: false, canWrite: true };
let db = null, assets = null, downloads = null, comments = null, listening = 'unknown', view = 'overview';
const VIEWS = ['overview', 'approvals', 'calendar', 'ideas', 'inbox', 'references', 'prefs'];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const plat = (p) => `<span class="plat p-${esc(p)}" title="${esc(PLAT[p]?.[1] || p)}">${esc(PLAT[p]?.[0] || p)}</span>`;
const nf = (n) => (n == null ? '—' : Number(n).toLocaleString('en-US'));
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (!isFinite(s)) return '';
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
const POST_STATUS = { draft: ['Draft', ''], awaiting_approval: ['Needs your OK', 'warn'], approved: ['Approved', 'ok'], scheduled: ['Scheduled', 'info'], posted: ['Posted', 'ok'], changes_requested: ['Changes asked', 'warn'], rejected: ['Rejected', 'bad'] };
const pill = (map, s) => `<span class="pill ${map[s]?.[1] || ''}">${esc(map[s]?.[0] || s)}</span>`;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }

async function write(fn, okMsg) {
  if (!db) return toast('Twizzy’s data is not connected in this view.');
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) {
    if (e?.code === 'invalid_argument') { state.canWrite = false; toast('You can view this dashboard but not change it.'); render(); }
    else if (e?.code === 'quota_exceeded') toast('Storage is full. Ask Twizzy to clear old activity.');
    else toast('That didn’t save. Check your connection and try again.');
  }
}
const nowIso = () => new Date().toISOString();

// Twizzy is Claude watching this dashboard. Sending a note "to Claude" wakes it.
async function checkListening() {
  if (!comments?.canSendToClaude) { listening = 'off'; return; }
  try { listening = await comments.canSendToClaude(); } catch { listening = 'off'; }
}
// Tell Twizzy about something the owner just did. Must run from the owner's tap.
async function tellTwizzy(el, text, quiet) {
  if (!comments) return false;
  try {
    if (listening !== 'available') await checkListening();
    if (listening !== 'available') { if (!quiet) toast('Saved. Twizzy will pick this up on its next daily run.'); return false; }
    const anchor = await comments.anchorFor(el || document.querySelector('h1'));
    await comments.sendToClaude({ anchor, text: 'Twizzy: ' + text });
    db && db.collection('activity').add({ text: 'Sent to Twizzy: ' + text.slice(0, 140), kind: 'you', at: nowIso() }).catch(() => {});
    return true;
  } catch (e) {
    if (e?.code === 'rate_limited') toast('Saved. Sending to Twizzy is busy, so it will be picked up on the next run.');
    else if (e?.code !== 'consent_required') toast('Saved, but Twizzy couldn’t be reached right now. It will be picked up on the next daily run.');
    return false;
  }
}
const LISTEN = { available: ['Twizzy is listening', 'ok'], no_session: ['Twizzy is offline, daily run only', 'warn'], writers_only: ['Only the owner can command Twizzy', ''], off: ['Commands unavailable here', ''], unknown: ['Connecting…', ''] };
const logActivity = (text) => db && db.collection('activity').add({ text, kind: 'you', at: nowIso() }).catch(() => {});

// ---------- views ----------
function counts() {
  const a = state.posts.filter((p) => p.status === 'awaiting_approval').length;
  const i = state.concepts.filter((c) => c.status === 'proposed').length;
  const m = state.inbox.filter((x) => x.status === 'pending' || x.status === 'flagged').length;
  const r = state.request?.open ? 1 : 0;
  document.getElementById('c-approvals').textContent = a || '';
  document.getElementById('c-ideas').textContent = i || '';
  document.getElementById('c-inbox').textContent = m || '';
  document.getElementById('c-refs').textContent = r || '';
  return { a, i, m, r };
}

function vOverview() {
  const c = counts();
  const posted = state.posts.filter((p) => p.status === 'posted');
  const recent = posted.filter((p) => Date.now() - new Date(p.posted_at || p.created_at) < 30 * 864e5);
  const views = recent.reduce((s, p) => s + (p.stats?.views || 0), 0);
  const week = state.posts.filter((p) => ['scheduled', 'approved'].includes(p.status) && p.scheduled_for && new Date(p.scheduled_for) - Date.now() < 7 * 864e5 && new Date(p.scheduled_for) > Date.now() - 864e5);
  const needs = [
    ...state.posts.filter((p) => p.status === 'awaiting_approval').map((p) => ({ t: p.title, s: 'Post waiting for approval', go: '#approvals', ps: p.platforms })),
    ...state.inbox.filter((x) => x.status === 'pending' || x.status === 'flagged').map((x) => ({ t: `${x.author}: “${(x.text || '').slice(0, 70)}”`, s: x.status === 'flagged' ? 'Flagged for you' : 'Reply waiting', go: '#inbox', ps: [x.platform] })),
    ...state.concepts.filter((x) => x.status === 'proposed').map((x) => ({ t: x.title, s: 'New idea', go: '#ideas', ps: x.platforms || [] })),
  ].slice(0, 6);
  const acc = state.accounts || {};
  const chan = ['tiktok', 'instagram', 'facebook', 'x', 'apkpure', 'uptodown'].map((k) => {
    const a = acc[k] || {};
    const st = a.status || 'not_connected';
    const label = { connected: ['Connected', 'ok'], manual: ['You post', 'info'], live: ['Live', 'ok'], not_connected: ['Not connected', ''], waiting: ['Waiting for you', 'warn'], review: ['In review', 'info'], error: ['Needs attention', 'bad'] }[st] || [st, ''];
    return `<div class="c">${plat(k)}<div><div class="h">${esc(a.handle || PLAT[k][1])}</div><div class="s"><span class="pill ${label[1]}">${esc(label[0])}</span></div></div></div>`;
  }).join('');
  const nextUp = state.posts.filter((p) => ['scheduled', 'approved'].includes(p.status)).sort((a, b) => String(a.scheduled_for).localeCompare(String(b.scheduled_for))).slice(0, 5);
  const feed = [...state.activity].sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 8);
  return `
  <div class="head"><div><h1>${greeting()}</h1><p class="sub">Here’s what Twizzy is doing for Ndalama. Anything that needs you is at the top.</p></div>
    <div class="row"><span class="pill ${state.settings?.paused ? 'warn' : 'ok'}">${state.settings?.paused ? 'Twizzy is paused' : 'Twizzy is active'}</span><span class="pill ${(LISTEN[listening] || LISTEN.off)[1]}">${(LISTEN[listening] || LISTEN.off)[0]}</span></div></div>
  <section class="card" id="cmd-card"><div class="card-head"><h2>Tell Twizzy</h2></div>
    <form id="cmd-form" class="row">

}
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

function media(p) {
  const m = p.media || {};
  if (m.url && m.kind === 'video') return `<div class="media"><video controls preload="metadata" playsinline src="${esc(m.url)}"></video></div>`;
  if (m.url) return `<div class="media"><img alt="" src="${esc(m.url)}"></div>`;
  return `<div class="media">Preview not ready</div>`;
}
// Download button for a post's video or image (falls back to opening it).
function dlButton(p, primary = true) {
  if (!p.media?.url) return '';
  const what = p.media.kind === 'video' ? 'video' : 'image';
  return downloads ? `<button class="btn ${primary ? 'primary' : ''}" data-act="dl">⬇ Download ${what}</button>`
    : `<a class="btn ${primary ? 'primary' : ''}" href="${esc(p.media.url)}" target="_blank" rel="noopener" download>⬇ Download ${what}</a>`;
}

const RENDER = { overview: vOverview, approvals: vApprovals, calendar: vCalendar, ideas: vIdeas, inbox: vInbox, references: vRefs, prefs: vPrefs };
function render() {
  counts();
  document.querySelectorAll('.nav').forEach((a) => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const foot = document.getElementById('rail-foot');
  if (!state.loaded) foot.innerHTML = `<strong>${state.offline ? 'Can’t reach Twizzy’s data yet' : 'Connecting…'}</strong>${state.offline ? 'Showing what’s loaded so far.' : 'Loading Twizzy’s data.'}`;
  else { const last = [...state.activity].sort((a, b) => String(b.at).localeCompare(String(a.at)))[0]; foot.innerHTML = `<strong>${state.settings?.paused ? 'Paused' : 'Active'}</strong>${last ? 'Last action ' + esc(ago(last.at)) : 'No runs yet'}`; }
  // Keep typed text across live updates.
  const keep = {};
  document.querySelectorAll('#view textarea, #view input[type=text], #view input[type=url], #view input[type=number]').forEach((e) => { if (e.id) keep[e.id] = e.value; });
  const focused = document.activeElement?.id;
  document.getElementById('view').innerHTML = RENDER[view]();
  for (const [id, v] of Object.entries(keep)) { const e = document.getElementById(id); if (e && document.activeElement !== e) e.value = v; }
  if (focused) document.getElementById(focused)?.focus();
}

// ---------- actions ----------
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-act]');
  if (b) {
    const card = b.closest('[data-id]'); const id = card?.dataset.id;
    const act = b.dataset.act;
    if (['approve', 'changes', 'reject'].includes(act)) {
      const p = state.posts.find((x) => x._id === id); if (!p) return;
      const caption = card.querySelector('[data-cap]').value; const note = card.querySelector('[data-note]').value.trim();
      const status = act === 'approve' ? 'approved' : act === 'changes' ? 'changes_requested' : 'rejected';
      if (act === 'changes' && !note) { card.querySelector('[data-note]').focus(); return toast('Write a short note so Twizzy knows what to change.'); }
      await write(() => db.doc('posts/' + id).update({ status, caption, note: note || p.note || '', decided_at: nowIso() }), { approved: 'Approved. Twizzy will post it.', changes_requested: 'Sent to Twizzy for changes.', rejected: 'Rejected.' }[status]);
      if (act === 'changes') tellTwizzy(card, `Remake post "${p.title}" (posts/${id}). Note: ${note}`);
      else if (act === 'approve') tellTwizzy(card, `Post "${p.title}" (posts/${id}) is approved and ready to post.`, true);
      logActivity(`You ${act === 'approve' ? 'approved' : act === 'changes' ? 'asked for changes to' : 'rejected'} “${p.title}”`);
    } else if (act === 'idea-yes' || act === 'idea-no') {
      const c = state.concepts.find((x) => x._id === id); if (!c) return;
      await write(() => db.doc('concepts/' + id).update({ status: act === 'idea-yes' ? 'approved' : 'passed', decided_at: nowIso() }), act === 'idea-yes' ? 'Twizzy will make it.' : 'Passed.');
      if (act === 'idea-yes') tellTwizzy(card, `Make the idea "${c.title}" (concepts/${id}) into a video and put it in Approvals.`);
      logActivity(`You ${act === 'idea-yes' ? 'approved the idea' : 'passed on'} “${c.title}”`);
    } else if (['send', 'sent', 'skip'].includes(act)) {
      const x = state.inbox.find((y) => y._id === id); if (!x) return;
      const reply = card.querySelector('[data-reply]')?.value || x.draft_reply || '';
      const status = act === 'send' ? 'approved' : act === 'sent' ? 'sent' : 'skipped';
      await write(() => db.doc('inbox/' + id).update({ status, final_reply: reply, decided_at: nowIso() }), { approved: 'Approved. Twizzy will reply.', sent: 'Marked as replied.', skipped: 'Won’t reply.' }[status]);
      if (status === 'approved') tellTwizzy(card, `Send the approved reply to ${x.author} (inbox/${id}).`, true);
    } else if (act === 'dl') {
      const p = state.posts.find((x) => x._id === id); if (!p?.media?.url) return;
      b.disabled = true; const label = b.textContent; b.textContent = 'Preparing…';
      try {
        const blob = await (await fetch(p.media.url)).blob();
        const ext = p.media.kind === 'video' ? 'mp4' : (blob.type.includes('png') ? 'png' : 'jpg');
        const name = 'ndalama-' + (p.title || 'post').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.' + ext;
        await downloads.save({ filename: name, data: blob });
      } catch (e) {
        if (e?.code === 'rate_limited') toast('A download is already open. Try again in a moment.');
        else if (e?.code !== 'declined') { window.open(p.media.url, '_blank', 'noopener'); toast('Opened the video. Press and hold it (or use ⋮) to save it.'); }
      }
      b.disabled = false; b.textContent = label;
    } else if (act === 'copycap') {
      const p = state.posts.find((x) => x._id === id); if (!p) return;
      try { await navigator.clipboard.writeText(p.caption || ''); toast('Caption copied.'); }
      catch { const c = card.querySelector('.caption'); const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Copy it with your keyboard.'); }
    } else if (act === 'posted') {
      const p = state.posts.find((x) => x._id === id); if (!p) return;
      const link = card.querySelector('[data-link]').value.trim();
      const links = { ...(p.links || {}) };
      if (link) { const k = /tiktok/.test(link) ? 'tiktok' : /x\.com|twitter/.test(link) ? 'x' : /instagram/.test(link) ? 'instagram' : /facebook|fb\./.test(link) ? 'facebook' : 'tiktok'; links[k] = link; }
      await write(() => db.doc('posts/' + id).update({ status: 'posted', posted_at: nowIso(), links }), 'Marked as posted.');
      logActivity(`You posted “${p.title}”`);
    } else if (act === 'copy') {
      const t = card.querySelector('[data-reply]');
      try { await navigator.clipboard.writeText(t.value); toast('Reply copied.'); } catch { t.select(); toast('Selected. Copy it with your keyboard.'); }
    }
    return;
  }
  const sb = ev.target.closest('.seg button');
  if (sb) { sb.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === sb)); return; }
  if (ev.target.id === 'pause') {
    const paused = !state.settings?.paused;
    await write(() => db.doc('config/settings').set({ ...(state.settings || {}), paused }), paused ? 'Twizzy paused.' : 'Twizzy resumed.');
  }
});

document.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (ev.target.id === 'prefs') {
    const segv = (n) => document.querySelector(`[data-seg="${n}"] [aria-pressed="true"]`)?.dataset.v;
    const num = (id) => Math.max(0, Math.min(21, Number(document.getElementById(id).value) || 0));
    const next = {
      ...(state.settings || {}),
      frequency: { tiktok: num('fq-tiktok'), instagram: num('fq-instagram'), facebook: num('fq-facebook'), x: num('fq-x') },
      reply_mode: segv('reply_mode'), tone: segv('tone'), music: segv('music'),
      languages: document.getElementById('pf-lang').value.trim(), hashtags: document.getElementById('pf-tags').value.trim(), avoid: document.getElementById('pf-avoid').value.trim(),
      links: { apkpure: document.getElementById('pf-apkpure').value.trim(), uptodown: document.getElementById('pf-uptodown').value.trim(), apk: document.getElementById('pf-apk').value.trim() },
      updated_at: nowIso(),
    };
    await write(() => db.doc('config/settings').set(next), 'Settings saved.');
  }
  if (ev.target.id === 'cmd-form') {
    const t = document.getElementById('cmd-text'); const text = t.value.trim();
    if (!text) return toast('Type what you want Twizzy to do.');
    const ok = await tellTwizzy(document.getElementById('cmd-card'), text);
    if (ok) { t.value = ''; toast('Sent. Twizzy is on it.'); }
    return;
  }
  if (ev.target.id === 'ref-form') {
    const url = document.getElementById('ref-url').value.trim();
    const file = document.getElementById('ref-file').files?.[0];
    const note = document.getElementById('ref-note').value.trim();
    const status = document.getElementById('ref-status');
    if (!url && !file) return toast('Add a link or choose a file.');
    let row = { kind: url ? 'link' : 'file', url, note, title: note ? note.slice(0, 80) : '', status: 'new', added_by: 'you', created_at: nowIso() };
    if (file) {
      if (!assets) return toast('Uploading isn’t available in this view. Paste a link instead.');
      if (file.size > 20 * 1024 * 1024) return toast('That file is over 20 MB. Share a link to it instead.');
      status.textContent = 'Uploading…';
      try { const a = await assets.upload(file); row = { ...row, kind: 'file', url: a.url, asset_id: a.id, title: note || file.name }; }
      catch { status.textContent = ''; return toast('Upload failed. Try a smaller file or a link.'); }
      status.textContent = '';
    }
    await write(async () => {
      await db.collection('references').add(row);
      if (state.request?.open) await db.doc('config/request').update({ open: false, answered_at: nowIso() });
    }, 'Reference added. Twizzy will study it.');
    tellTwizzy(ev.target, `Study the new reference "${row.title || row.url}" and use its style in the next videos.`, true);
    ev.target.reset();
  }
});

// ---------- routing & data ----------
function route() { const h = location.hash.slice(1); view = VIEWS.includes(h) ? h : 'overview'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
route();

(async () => {
  const claude = window.claude;
  if (!claude?.use) { state.offline = true; render(); return; }
  const [d, u, a, dl, cm] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('assets'), claude.use('downloads'), claude.use('comments')]);
  db = d; assets = a; downloads = dl; comments = cm; await checkListening(); render();
  setInterval(() => checkListening().then(render), 60000);
  if (u) { const w = await u.can?.('data.write'); if (w === false) state.canWrite = false; }
  if (!db) { state.offline = true; render(); return; }
  const timer = setTimeout(() => { if (!state.loaded) { state.offline = true; render(); } }, 10000);
  const done = (meta) => { if (!meta?.fromCache) { state.loaded = true; state.offline = false; clearTimeout(timer); } render(); };
  const err = () => { state.offline = true; render(); };
  const col = (name, key) => db.collection(name).onSnapshot((s) => { state[key] = s.docs.map((x) => ({ _id: x.id, ...x.data() })); done(s.metadata); }, err);
  col('posts', 'posts'); col('concepts', 'concepts'); col('inbox', 'inbox'); col('references', 'refs');
  db.collection('activity').orderBy('at', 'desc').limit(30).onSnapshot((s) => { state.activity = s.docs.map((x) => ({ _id: x.id, ...x.data() })); done(s.metadata); }, err);
  for (const [path, key] of [['config/settings', 'settings'], ['config/accounts', 'accounts'], ['config/request', 'request']]) {
    db.doc(path).onSnapshot((s) => { state[key] = s.exists ? s.data() : null; done(s.metadata); }, err);
  }
})();
</script>
